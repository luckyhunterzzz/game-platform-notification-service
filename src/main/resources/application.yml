server:
  port: 8086

spring:
  application:
    name: notification-service
  jpa:
    open-in-view: false
  mail:
    host: ${KC_SMTP_HOST:smtp.example.com}
    port: ${KC_SMTP_PORT:465}
    username: ${KC_SMTP_USER:noreply@example.com}
    password: ${KC_SMTP_PASSWORD:replace_with_smtp_password}
    properties:
      mail:
        smtp:
          auth: ${KC_SMTP_AUTH:true}
          ssl:
            enable: ${KC_SMTP_SSL:true}
          starttls:
            enable: ${KC_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "http.server.requests": true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

app:
  hero-bug-report:
    retry:
      enabled: true
      cron: "0 */5 * * * *"
      batch-size: 20
      max-attempts: 5
      delay-minutes: 15
  kafka:
    topics:
      notification-events: notification-events
      hero-bug-report-created: hero-bug-report-created
  mail:
    from: ${KC_SMTP_FROM:noreply@example.com}
    from-display-name: ${KC_SMTP_FROM_DISPLAY_NAME:Game Platform}
    admin-recipient: ${KC_SMTP_ADMIN_RECIPIENT:admin@example.com}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:${spring.application.name}@local}
  send-default-pii: false
