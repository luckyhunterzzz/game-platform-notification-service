spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoint:
    health:
      show-details: always

app:
  hero-bug-report:
    retry:
      enabled: ${APP_HERO_BUG_REPORT_RETRY_ENABLED:true}
      cron: "${APP_HERO_BUG_REPORT_RETRY_CRON:0 */5 * * * *}"
      batch-size: ${APP_HERO_BUG_REPORT_RETRY_BATCH_SIZE:20}
      max-attempts: ${APP_HERO_BUG_REPORT_RETRY_MAX_ATTEMPTS:5}
      delay-minutes: ${APP_HERO_BUG_REPORT_RETRY_DELAY_MINUTES:15}
  kafka:
    topics:
      notification-events: ${APP_KAFKA_TOPIC_NOTIFICATION_EVENTS:notification-events}
      hero-bug-report-created: ${APP_KAFKA_TOPIC_HERO_BUG_REPORT_CREATED:hero-bug-report-created}
  mail:
    admin-recipient: ${KC_SMTP_ADMIN_RECIPIENT:admin@example.com}
